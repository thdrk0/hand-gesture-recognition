<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">Hand Gesture Recognition</title>
  <desc id="desc">PC webcam or ESP32-S3 camera, hand recognition, stable digits one through five.</desc>
  <rect width="960" height="280" rx="20" fill="#101827"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="48" fill="#f1f5f9" font-size="24" font-weight="700">Hand Gesture Recognition</text>
    <text x="40" y="75" fill="#94a3b8" font-size="14">From a webcam prototype to on-device inference.</text>
    <rect x="40" y="111" width="248" height="126" rx="12" fill="#1e293b"/>
    <text x="60" y="145" fill="#67e8f9" font-size="13" font-weight="700">CAPTURE</text>
    <text x="60" y="178" fill="#f1f5f9" font-size="19">Webcam / ESP32-S3</text>
    <text x="60" y="207" fill="#94a3b8" font-size="13">OpenCV / OV3660 camera</text>
    <path d="M304 174h35m-9-7 9 7-9 7" fill="none" stroke="#64748b" stroke-width="2"/>
    <rect x="354" y="111" width="248" height="126" rx="12" fill="#1e293b"/>
    <text x="374" y="145" fill="#67e8f9" font-size="13" font-weight="700">RECOGNIZE</text>
    <text x="374" y="178" fill="#f1f5f9" font-size="19">MediaPipe / ESP-DL</text>
    <text x="374" y="207" fill="#94a3b8" font-size="13">Confidence + temporal filtering</text>
    <path d="M618 174h35m-9-7 9 7-9 7" fill="none" stroke="#64748b" stroke-width="2"/>
    <rect x="668" y="111" width="252" height="126" rx="12" fill="#1e293b"/>
    <text x="688" y="145" fill="#86efac" font-size="13" font-weight="700">SELECT</text>
    <text x="688" y="182" fill="#f1f5f9" font-size="27" letter-spacing="9">1 2 3 4 5</text>
    <text x="688" y="211" fill="#94a3b8" font-size="13">Live feedback + selection events</text>
  </g>
</svg>
